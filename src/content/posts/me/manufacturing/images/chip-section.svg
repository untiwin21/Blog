<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="07  칩 단면적: 절삭 후의 넓은 표면적과 다르다"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#e07824" stroke-width="2"/></marker></defs><rect width="1000" height="430" fill="#f8fafc"/><g font-family="Arial, Noto Sans CJK KR, sans-serif"><text x="30" y="42" font-size="27" fill="#172b4d">07  칩 단면적: 절삭 후의 넓은 표면적과 다르다</text><text x="45" y="95" font-size="22" fill="#172b4d">단순 직교절삭 모델 · 깎이기 전 단면</text><rect x="70" y="130" width="360" height="220" rx="0" fill="#bfd3e6" stroke="#334e68" stroke-width="2"/><rect x="70" y="130" width="360" height="70" rx="0" fill="#f6bd70" stroke="#334e68" stroke-width="2"/><text x="195" y="175" font-size="24" fill="#172b4d">A = b × h</text><text x="195" y="385" font-size="22" fill="#172b4d">폭 b</text><text x="445" y="175" font-size="22" fill="#172b4d">두께 h</text><text x="550" y="145" font-size="24" fill="#172b4d">공구가 전진할 때</text><text x="550" y="190" font-size="22" fill="#172b4d">이 단면의 재료가 칩이 된다.</text><text x="550" y="250" font-size="20" fill="#172b4d">h 증가 → 변형시킬 재료 증가</text><text x="550" y="290" font-size="20" fill="#172b4d">→ 보통 절삭력 증가</text><text x="550" y="350" font-size="19" fill="#172b4d">주원인: 소성변형 저항 + 마찰</text><text x="30" y="412" font-size="15" fill="#52667a">개념 설명도 · 실제 장비 형상 / 축척 / 가공 조건을 재현한 그림이 아님</text></g></svg>