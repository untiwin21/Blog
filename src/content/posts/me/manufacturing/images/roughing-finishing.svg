<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="06  황삭 후 정삭: 재료 제거와 최종 치수를 나눈다"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#e07824" stroke-width="2"/></marker></defs><rect width="1000" height="460" fill="#f8fafc"/><g font-family="Arial, Noto Sans CJK KR, sans-serif"><text x="30" y="42" font-size="27" fill="#172b4d">06  황삭 후 정삭: 재료 제거와 최종 치수를 나눈다</text><rect x="65" y="115" width="190" height="220" rx="0" fill="#bfd3e6" stroke="#334e68" stroke-width="2"/><text x="70" y="95" font-size="20" fill="#172b4d">소재: 20 mm</text><path d="M290,230 L365,230" fill="none" stroke="#e07824" stroke-width="4" marker-end="url(#arrow)"/><rect x="400" y="167" width="190" height="168" rx="0" fill="#bfd3e6" stroke="#334e68" stroke-width="2"/><rect x="400" y="167" width="190" height="8" rx="0" fill="#f6bd70" stroke="#334e68" stroke-width="2"/><text x="385" y="95" font-size="20" fill="#172b4d">황삭 후: 15.3 mm</text><text x="390" y="375" font-size="17" fill="#172b4d">주황색 = 정삭 여유 0.3 mm</text><path d="M625,230 L700,230" fill="none" stroke="#e07824" stroke-width="4" marker-end="url(#arrow)"/><rect x="735" y="175" width="190" height="160" rx="0" fill="#bfd3e6" stroke="#334e68" stroke-width="2"/><text x="745" y="95" font-size="20" fill="#172b4d">정삭 후: 15 mm</text><text x="65" y="410" font-size="18" fill="#172b4d">수치는 설명용이다. 실제 정삭 여유는 재료·형상·공정에 따라 정한다.</text><text x="30" y="442" font-size="15" fill="#52667a">개념 설명도 · 실제 장비 형상 / 축척 / 가공 조건을 재현한 그림이 아님</text></g></svg>