<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="03  원형 공구라도 바깥 직각은 가능하다"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#e07824" stroke-width="2"/></marker></defs><rect width="1000" height="430" fill="#f8fafc"/><g font-family="Arial, Noto Sans CJK KR, sans-serif"><text x="30" y="42" font-size="27" fill="#172b4d">03  원형 공구라도 바깥 직각은 가능하다</text><text x="45" y="95" font-size="22" fill="#172b4d">안쪽 모서리 · 위에서 본 모습</text><rect x="60" y="125" width="350" height="220" rx="0" fill="#bfd3e6" stroke="#334e68" stroke-width="2"/><rect x="110" y="175" width="250" height="120" rx="30" fill="white" stroke="#334e68" stroke-width="2"/><circle cx="140" cy="205" r="30" fill="#42a5a0" stroke="#334e68" stroke-width="2"/><path d="M140,205 L110,175" fill="none" stroke="#e07824" stroke-width="4" marker-end="url(#arrow)"/><text x="65" y="385" font-size="18" fill="#172b4d">벽을 보존하면 공구 반지름이 남는다</text><text x="520" y="95" font-size="22" fill="#172b4d">바깥 모서리 · 위에서 본 모습</text><rect x="570" y="165" width="240" height="150" rx="0" fill="#bfd3e6" stroke="#334e68" stroke-width="2"/><circle cx="850" cy="125" r="30" fill="#42a5a0" stroke="#334e68" stroke-width="2"/><path d="M540 125 H850 V345" fill="none" stroke="#e07824" stroke-width="3" stroke-dasharray="8 5"/><text x="535" y="385" font-size="18" fill="#172b4d">공구가 부품 바깥으로 지나갈 수 있다</text><text x="30" y="412" font-size="15" fill="#52667a">개념 설명도 · 실제 장비 형상 / 축척 / 가공 조건을 재현한 그림이 아님</text></g></svg>