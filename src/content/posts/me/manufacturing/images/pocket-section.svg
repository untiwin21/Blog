<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="02  포켓은 부품 전체가 아니라 파인 공간이다"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#e07824" stroke-width="2"/></marker></defs><rect width="1000" height="430" fill="#f8fafc"/><g font-family="Arial, Noto Sans CJK KR, sans-serif"><text x="30" y="42" font-size="27" fill="#172b4d">02  포켓은 부품 전체가 아니라 파인 공간이다</text><text x="45" y="100" font-size="22" fill="#172b4d">위에서 본 모습</text><rect x="55" y="135" width="360" height="205" rx="0" fill="#bfd3e6" stroke="#334e68" stroke-width="2"/><rect x="125" y="180" width="220" height="115" rx="22" fill="#fff" stroke="#334e68" stroke-width="2"/><text x="155" y="245" font-size="22" fill="#172b4d">포켓 내부</text><text x="450" y="100" font-size="22" fill="#172b4d">가운데를 잘라 본 단면</text><path d="M470 160 H545 V285 H785 V160 H860 V340 H470 Z" fill="#bfd3e6" stroke="#334e68" stroke-width="3"/><text x="590" y="210" font-size="22" fill="#172b4d">빈 공간</text><text x="585" y="320" font-size="18" fill="#172b4d">남아 있는 바닥</text><text x="50" y="385" font-size="21" fill="#172b4d">바닥이 남으면 포켓, 두께 전체를 관통하면 관통 구멍이다.</text><text x="30" y="412" font-size="15" fill="#52667a">개념 설명도 · 실제 장비 형상 / 축척 / 가공 조건을 재현한 그림이 아님</text></g></svg>